# ESP32-S3 on its native USB-C port. The chip's USB data pads carry the bus, so there is no extra
# hardware: a USB-C cable from the board to the lamp's K-Link port is all that is wired.
# D- is GPIO19 (UART TX) and D+ is GPIO20 (UART RX).
substitutions:
  dm_pin: "19"
  dp_pin: "20"

  # On-board RGB LED of the ESP32-S3-DevKitC-1 v1.0 (v1.1 boards use 38); only used with common/rgb-led.yaml.
  rgb_pin: "48"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
