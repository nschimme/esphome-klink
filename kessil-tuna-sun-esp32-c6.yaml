# DEPRECATED compatibility shim, kept so existing dashboard imports keep working.
# New installs: use kessil-leader-<board>.yaml, which includes all three lamp models.
# Kessil Tuna Sun on an ESP32-C6 (tested). Flash this, or adopt it from the ESPHome dashboard.
# See docs/getting-started.md for wiring, safety notes and the other ways to use this file.
substitutions:
  name: kessil-tuna-sun
  friendly_name: Kessil Tuna Sun

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: nschimme.esphome-klink
    version: "0.2.0"

dashboard_import:
  package_import_url: github://nschimme/esphome-klink/kessil-tuna-sun-esp32-c6.yaml@main
  import_full_config: false

packages:
  board: !include boards/esp32-c6.yaml
  network: !include common/network-wifi.yaml
  base: !include common/base.yaml
  lamp: !include common/tuna-sun.yaml
