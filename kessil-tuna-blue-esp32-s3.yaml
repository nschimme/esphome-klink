# Kessil Tuna Blue on an ESP32-S3 (untested). Flash this, or adopt it from the ESPHome dashboard.
# See the README for wiring, safety notes and the other ways to use this file.
substitutions:
  name: kessil-tuna-blue
  friendly_name: Kessil Tuna Blue

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: nschimme.esphome-klink
    version: "0.1.0"

dashboard_import:
  package_import_url: github://nschimme/esphome-klink/kessil-tuna-blue-esp32-s3.yaml@main
  import_full_config: false

packages:
  board: !include boards/esp32-s3.yaml
  base: !include common/base.yaml
  lamp: !include common/tuna-blue.yaml
