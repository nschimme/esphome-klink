# Shared by every lamp package: the K-Link hub, the clock, and the controls that are not tied to a
# lamp model. Pulled in by the lamp packages, not used on its own.
#
# Substitutions you can override (defaults below):
#   timezone     the schedule runs on local time, so set your own, e.g. Europe/Berlin
#   auto_writes  "true" = announce and claim the chain by itself at boot;
#                "false" = never transmit until you turn the "Send to lights" switch on
#   role         "leader" (default) drives the chain. For a follower board use common/follower-base.yaml
#                instead of this file: it keeps only the hub, without the leader controls
#   klink_ref    the git branch, tag or commit of this repository to take the component from
#                (default main); set it to test a branch, e.g. klink_ref: ux-redesign
substitutions:
  timezone: Etc/UTC
  auto_writes: "false"
  klink_ref: main
  # leader: announce, claim and drive the chain. follower: follow the leader's group writes and
  # answer its scan for this board's lamps.
  role: leader
  # Chain timing. A leader announces itself, waits for claim_confirm, then writes if no other
  # controller has written for guard_quiet_time. A foreign write while controlling pauses this
  # leader; it tries again after conflict_release.
  beacon_interval: "1s"
  claim_confirm: "2s"
  guard_quiet_time: "3s"
  conflict_release: "10s"

external_components:
  - source:
      type: git
      url: https://github.com/nschimme/esphome-klink
      ref: ${klink_ref}
    components: [klink]

# ESPHome's own device page (Home Assistant-style, version 3) for every entity. The esphome-klink page at /klink
# is the program editor; this one is the plain list of controls. `local: true` serves the page from the
# device, so it works on the setup access point without internet. To protect both pages, add
# `auth: { username: ..., password: ... }` in your own config.
web_server:
  version: 3
  local: true
  sorting_groups:
    - { id: controls, name: "Controls", sorting_weight: 10 }
    - { id: program, name: "Program", sorting_weight: 20 }
    - { id: behavior, name: "Light behavior", sorting_weight: 25 }
    - { id: sky, name: "Sun and moon", sorting_weight: 27 }
    - { id: bus, name: "Bus and setup", sorting_weight: 30 }

logger:
  baud_rate: 0     # the USB pads are used for the bus, so there is no serial console
  level: INFO

time:
  - platform: sntp
    id: local_time
    timezone: ${timezone}

# 8N1 at 115200. tx_pin MUST be the D- pad: the klink component routes the UART's TX signal to D+
# plain and to D- inverted. The board file sets dm_pin / dp_pin for each chip.
uart:
  id: klink_uart
  tx_pin: GPIO${dm_pin}   # D-
  rx_pin: GPIO${dp_pin}   # D+ (also read back while transmitting; the bus ignores the echo)
  baud_rate: 115200
  rx_buffer_size: 1024

klink:
  id: kl
  uart_id: klink_uart
  timezone: ${timezone}
  time_id: local_time
  auto_writes: ${auto_writes}
  role: ${role}
  beacon_interval: ${beacon_interval}
  claim_confirm: ${claim_confirm}
  guard_quiet_time: ${guard_quiet_time}
  conflict_release: ${conflict_release}
  direct_drive:
    positive_pin: ${dp_pin}
    negative_pin: ${dm_pin}
  on_lamp_found:
    - logger.log:
        format: "Found lamp KID %u in GID %u (type %u)"
        args: ["kid", "gid", "type"]

number:
  - { platform: klink, type: latitude, name: "Latitude", web_server: { sorting_group_id: sky } }
  - { platform: klink, type: longitude, name: "Longitude", web_server: { sorting_group_id: sky } }

switch:
  - platform: klink            # OFF = dry run (frames are logged, nothing is sent)
    type: writes
    name: "Send to lights"
    entity_category: diagnostic
    restore_mode: RESTORE_DEFAULT_OFF
    web_server: { sorting_group_id: bus }

button:
  - { platform: klink, type: retry, name: "Retry", entity_category: diagnostic, web_server: { sorting_group_id: bus } }

text_sensor:
  - { platform: klink, name: "Bus state", entity_category: diagnostic, web_server: { sorting_group_id: bus } }
  # Where to find the esphome-klink page: shown in Home Assistant (device page, diagnostics) and on the
  # ESPHome page. The device also advertises it over mDNS as an _http service with path /klink.
  - platform: template
    name: "Open esphome-klink"
    icon: mdi:calendar-edit
    entity_category: diagnostic
    update_interval: 60s
    web_server: { sorting_group_id: bus }
    lambda: |-
      char buf[network::IP_ADDRESS_BUFFER_SIZE];
      for (auto &address : network::get_ip_addresses()) {
        if (address.is_set())
          return std::string("http://") + address.str_to(buf) + "/klink";
      }
      return std::string();

# Advertise the programming page to network browsers (Bonjour / mDNS service discovery).
mdns:
  services:
    - service: _http
      protocol: _tcp
      port: 80
      txt:
        path: /klink
        project: esphome-klink

sensor:
  # The home location from Home Assistant (zone.home), for the sun and moon programs. Entities entered
  # below (latitude, longitude) override it; the YAML latitude/longitude of the klink: block is the fallback.
  - platform: homeassistant
    id: ha_home_latitude
    entity_id: zone.home
    attribute: latitude
    internal: true
    on_value:
      then:
        - lambda: 'id(kl)->set_ha_coordinate(0, x);'
  - platform: homeassistant
    id: ha_home_longitude
    entity_id: zone.home
    attribute: longitude
    internal: true
    on_value:
      then:
        - lambda: 'id(kl)->set_ha_coordinate(1, x);'
  - { platform: klink, type: lamps, name: "Known lamps", web_server: { sorting_group_id: bus } }
  - { platform: klink, type: bus_timeouts, name: "Bus timeouts", web_server: { sorting_group_id: bus } }
