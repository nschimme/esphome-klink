# Shared by every lamp package: the K-Link hub, the clock, and the controls that are not tied to a
# lamp model. Pulled in by the lamp packages, not used on its own.
#
# Substitutions you can override (defaults below):
#   timezone     the schedule runs on local time, so set your own, e.g. Europe/Berlin
#   auto_writes  "true" = listen first and take over the bus by itself once it has been quiet;
#                "false" = never transmit until you turn the "Send to lights" switch on
substitutions:
  timezone: Etc/UTC
  auto_writes: "false"

external_components:
  - source:
      type: git
      url: https://github.com/nschimme/esphome-klink
      ref: main
    components: [klink]

logger:
  baud_rate: 0     # the USB pads are used for the bus, so there is no serial console
  level: INFO

# Connectivity, so a freshly flashed device can be set up and updated without editing YAML: with no
# Wi-Fi credentials it opens a "Kessil" access point with a captive portal where you pick your network;
# the API connects Home Assistant; OTA allows later updates over Wi-Fi. To use fixed credentials, add your
# own `wifi:` (and `api:` encryption key / `ota:` password) in the config that includes this package.
wifi:
  ap:
    ssid: "${name} Setup"

captive_portal:

api:

ota:
  - platform: esphome

time:
  - platform: sntp
    id: local_time
    timezone: ${timezone}

# 8N1 at 115200. tx_pin MUST be the D- pad: the klink component routes the UART's TX signal to D+
# plain and to D- inverted. The board file sets dm_pin / dp_pin for each chip.
uart:
  id: klink_uart
  tx_pin: GPIO${dm_pin}   # D-
  rx_pin: GPIO${dp_pin}   # D+ (also read back while transmitting; the bus ignores the echo)
  baud_rate: 115200
  rx_buffer_size: 1024

klink:
  id: kl
  uart_id: klink_uart
  auto_writes: ${auto_writes}
  direct_drive:
    positive_pin: ${dp_pin}
    negative_pin: ${dm_pin}
  on_lamp_found:
    - logger.log:
        format: "Found lamp KID %u in GID %u (type %u)"
        args: ["kid", "gid", "type"]

switch:
  - platform: klink            # OFF = dry run (frames are logged, nothing is sent)
    type: writes
    name: "Send to lights"
    restore_mode: RESTORE_DEFAULT_OFF

button:
  - { platform: klink, type: retry, name: "Retry", entity_category: diagnostic }

text_sensor:
  - { platform: klink, name: "Bus state" }

sensor:
  - { platform: klink, type: lamps, name: "Known lamps" }
  - { platform: klink, type: bus_timeouts, name: "Bus timeouts" }
