# Tuna Sun: one K-Link group with a manual light, an 8-point daily program you can edit from Home
# Assistant, and a point editor. Include it together with a board file and common/base.yaml
# (the top-level kessil-*.yaml files do this for you).
#
# Substitutions you can override:
#   tuna_sun_gid   the K-Link group this controls (default 2)
substitutions:
  tuna_sun_gid: "2"

light:
  # Manual override for the whole group. Brightness drives intensity (INT). Touching the light switches
  # the group to Manual; set Mode to Program to hand control back to the daily program.
  - platform: klink
    output_id: tuna_sun
    klink_id: kl
    name: "Tuna Sun"
    gid: ${tuna_sun_gid}
    time_id: local_time
    model: tuna_sun
    slots: 8
    web_server: { sorting_group_id: controls }
    # Kessil's A360X specification: 6,000 K to 9,000 K plus red and yellow (amber). Color value 0 is the
    # warm end (6,000 K). The spacing between the ends is assumed linear in mireds, not measured.
    cold_white_color_temperature: 9000 K
    warm_white_color_temperature: 6000 K
    invert_color: true
    effects:
      - klink_pulse:
      - klink_color_sweep:
      - klink_sunrise:
      - klink_sunset:

# The daily program: "HH:MM int=0-255 clr=0-255 ..." per point (any subset of channels, the rest 0), or
# "off". The light moves linearly between points. These are starting values; edits made in Home
# Assistant are kept in flash and take precedence.
text:
  - { platform: klink, group: tuna_sun, slot: 1, name: "Tuna Sun point 1", initial_value: "08:00 int=0 clr=0", web_server: { sorting_group_id: program } }
  - { platform: klink, group: tuna_sun, slot: 2, name: "Tuna Sun point 2", initial_value: "09:00 int=40 clr=20", web_server: { sorting_group_id: program } }
  - { platform: klink, group: tuna_sun, slot: 3, name: "Tuna Sun point 3", initial_value: "11:00 int=100 clr=60", web_server: { sorting_group_id: program } }
  - { platform: klink, group: tuna_sun, slot: 4, name: "Tuna Sun point 4", initial_value: "14:00 int=130 clr=90", web_server: { sorting_group_id: program } }
  - { platform: klink, group: tuna_sun, slot: 5, name: "Tuna Sun point 5", initial_value: "17:00 int=100 clr=60", web_server: { sorting_group_id: program } }
  - { platform: klink, group: tuna_sun, slot: 6, name: "Tuna Sun point 6", initial_value: "19:00 int=40 clr=20", web_server: { sorting_group_id: program } }
  - { platform: klink, group: tuna_sun, slot: 7, name: "Tuna Sun point 7", initial_value: "20:30 int=0 clr=0", web_server: { sorting_group_id: program } }
  - { platform: klink, group: tuna_sun, slot: 8, name: "Tuna Sun point 8", initial_value: "off", web_server: { sorting_group_id: program } }

# Program editor: pick a point, then edit its time and values, like the controller's Quick Set screen.
# Edits apply to the running program at once and are saved to flash a couple of seconds after the last
# change. Editing a point turns it on; use the switch to turn a point off.
select:
  - { platform: klink, group: tuna_sun, type: mode, name: "Tuna Sun mode", web_server: { sorting_group_id: controls } }
  - { platform: klink, group: tuna_sun, name: "Tuna Sun program point", web_server: { sorting_group_id: program } }

text_sensor:
  - { platform: klink, group: tuna_sun, type: status, name: "Tuna Sun status", web_server: { sorting_group_id: controls } }

datetime:
  - { platform: klink, group: tuna_sun, type: time, name: "Tuna Sun point time", web_server: { sorting_group_id: program } }

number:
  # Manual red and amber, outside the program. Setting one takes manual control of the group.
  - { platform: klink, group: tuna_sun, channel: 4, name: "Tuna Sun red", web_server: { sorting_group_id: controls } }
  - { platform: klink, group: tuna_sun, channel: 5, name: "Tuna Sun amber", web_server: { sorting_group_id: controls } }
  - { platform: klink, group: tuna_sun, point_channel: 1, name: "Tuna Sun point INT (0-255)", entity_category: config, web_server: { sorting_group_id: program } }
  - { platform: klink, group: tuna_sun, point_channel: 2, name: "Tuna Sun point CLR (0-255)", entity_category: config, web_server: { sorting_group_id: program } }
  - { platform: klink, group: tuna_sun, point_channel: 4, name: "Tuna Sun point R (0-100)", entity_category: config, web_server: { sorting_group_id: program } }
  - { platform: klink, group: tuna_sun, point_channel: 5, name: "Tuna Sun point AM (0-100)", entity_category: config, web_server: { sorting_group_id: program } }

switch:
  - platform: klink            # the selected point on or off
    type: point_enabled
    group: tuna_sun
    name: "Tuna Sun point enabled"
    web_server: { sorting_group_id: program }
