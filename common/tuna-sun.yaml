# Tuna Sun: one K-Link group with a manual light, a 16-point daily program you can edit from Home
# Assistant, and a point editor. Include it together with a board file and common/base.yaml
# (the top-level kessil-*.yaml files do this for you).
#
# This is a thin wrapper around the reusable template common/group-tuna-sun.yaml. To add another
# Tuna Sun group, include the template directly with its vars (see the template header and
# docs/configuration.md); this file keeps the default group.
#
# Substitutions you can override:
#   tuna_sun_gid   the K-Link group this controls (default 2). Changing it moves the group; the
#                  entity names and ids stay the same, so stored programs follow the group.
substitutions:
  tuna_sun_gid: "2"

packages:
  group: !include {file: group-tuna-sun.yaml, vars: {id: tuna_sun, name: Tuna Sun, gid: "${tuna_sun_gid}"}}
