# Shared by a follower board: the K-Link hub and nothing else. A follower never starts a frame; it
# follows the leader's group writes and answers the leader's scan for its lamps. It has no Send to
# lights switch, Retry button, scan or program page. Use it instead of common/base.yaml on every board
# that is not the chain leader (docs/leader-follower.md).
#
# Substitutions you can override (defaults below):
#   timezone     only needed when you add a read-only K-Link group light (it wants a clock)
#   klink_ref    the git branch, tag or commit of this repository to take the component from
#   klink_version  the project version this follower reports as its firmware
substitutions:
  timezone: Etc/UTC
  klink_ref: main
  klink_version: "0.2.0"

# The `08` reply a follower's lamps send reports this project version, so the leader's lamp list
# shows the firmware the follower was built from instead of 0.0.0.
esphome:
  project:
    name: nschimme.esphome-klink
    version: ${klink_version}

external_components:
  - source:
      type: git
      url: https://github.com/nschimme/esphome-klink
      ref: ${klink_ref}
    components: [klink]

logger:
  baud_rate: 0     # the USB pads are used for the bus, so there is no serial console
  level: INFO

time:
  - platform: sntp
    id: local_time
    timezone: ${timezone}

# 8N1 at 115200. tx_pin MUST be the D- pad (see common/base.yaml); a follower only transmits lamp
# replies.
uart:
  id: klink_uart
  tx_pin: GPIO${dm_pin}   # D-
  rx_pin: GPIO${dp_pin}   # D+
  baud_rate: 115200
  rx_buffer_size: 1024

klink:
  id: kl
  uart_id: klink_uart
  timezone: ${timezone}
  time_id: local_time
  role: follower
  direct_drive:
    positive_pin: ${dp_pin}
    negative_pin: ${dm_pin}

text_sensor:
  - { platform: klink, name: "Bus state", entity_category: diagnostic }
