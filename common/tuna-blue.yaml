# Tuna Blue: one K-Link group with a manual light, an 8-point daily program you can edit from Home
# Assistant, and a point editor. Include it together with a board file and common/base.yaml
# (the top-level kessil-*.yaml files do this for you).
#
# Substitutions you can override:
#   tuna_blue_gid   the K-Link group this controls (default 1)
substitutions:
  tuna_blue_gid: "1"
# NOT TESTED on a real Tuna Blue: the channel layout (violet, red, green) is unconfirmed.

light:
  # Manual override for the whole group. Brightness drives intensity (INT). Use "resume schedule" to
  # hand control back to the program.
  - platform: klink
    output_id: tuna_blue
    klink_id: kl
    name: "Tuna Blue"
    gid: ${tuna_blue_gid}
    time_id: local_time
    model: tuna_blue
    slots: 8
    effects:
      - klink_pulse:
      - klink_color_sweep:
      - klink_sunrise:
      - klink_sunset:

# The daily program: "HH:MM int=0-255 clr=0-255 ..." per point (any subset of channels, the rest 0), or
# "off". The light moves linearly between points. These are starting values; edits made in Home
# Assistant are kept in flash and take precedence.
text:
  - { platform: klink, group: tuna_blue, slot: 1, name: "Tuna Blue point 1", initial_value: "08:00 int=0 clr=0" }
  - { platform: klink, group: tuna_blue, slot: 2, name: "Tuna Blue point 2", initial_value: "09:00 int=40 clr=40" }
  - { platform: klink, group: tuna_blue, slot: 3, name: "Tuna Blue point 3", initial_value: "11:00 int=100 clr=100" }
  - { platform: klink, group: tuna_blue, slot: 4, name: "Tuna Blue point 4", initial_value: "14:00 int=130 clr=150" }
  - { platform: klink, group: tuna_blue, slot: 5, name: "Tuna Blue point 5", initial_value: "17:00 int=100 clr=100" }
  - { platform: klink, group: tuna_blue, slot: 6, name: "Tuna Blue point 6", initial_value: "19:00 int=40 clr=40" }
  - { platform: klink, group: tuna_blue, slot: 7, name: "Tuna Blue point 7", initial_value: "20:30 int=0 clr=0" }
  - { platform: klink, group: tuna_blue, slot: 8, name: "Tuna Blue point 8", initial_value: "off" }

# Program editor: pick a point, then edit its time and values, like the controller's Quick Set screen.
# Edits apply to the running program at once and are saved to flash a couple of seconds after the last
# change. Editing a point turns it on; use the switch to turn a point off.
select:
  - { platform: klink, group: tuna_blue, name: "Tuna Blue program point" }

datetime:
  - { platform: klink, group: tuna_blue, type: time, name: "Tuna Blue point time" }

number:
  # Manual extra channels, outside the program. Setting one takes manual control of the group.
  - { platform: klink, group: tuna_blue, channel: 2, name: "Tuna Blue color (raw 0-255)" }
  - { platform: klink, group: tuna_blue, channel: 3, name: "Tuna Blue violet" }
  - { platform: klink, group: tuna_blue, channel: 4, name: "Tuna Blue red" }
  - { platform: klink, group: tuna_blue, channel: 5, name: "Tuna Blue green" }
  - { platform: klink, group: tuna_blue, point_channel: 1, name: "Tuna Blue point INT (0-255)", entity_category: config }
  - { platform: klink, group: tuna_blue, point_channel: 2, name: "Tuna Blue point CLR (0-255)", entity_category: config }
  - { platform: klink, group: tuna_blue, point_channel: 3, name: "Tuna Blue point violet (0-100)", entity_category: config }
  - { platform: klink, group: tuna_blue, point_channel: 4, name: "Tuna Blue point red (0-100)", entity_category: config }
  - { platform: klink, group: tuna_blue, point_channel: 5, name: "Tuna Blue point green (0-100)", entity_category: config }

switch:
  - platform: klink            # the selected point on or off
    type: point_enabled
    group: tuna_blue
    name: "Tuna Blue point enabled"
  - platform: klink            # run the program (turning it on also ends a manual override)
    type: schedule
    group: tuna_blue
    name: "Tuna Blue schedule"
    restore_mode: RESTORE_DEFAULT_ON
  - platform: klink            # hold the current level without leaving the program
    type: pause
    group: tuna_blue
    name: "Tuna Blue pause"
    restore_mode: RESTORE_DEFAULT_OFF

button:
  - { platform: klink, type: resume_schedule, group: tuna_blue, name: "Tuna Blue resume schedule" }
