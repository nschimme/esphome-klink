# Tuna Blue: one K-Link group with a manual light, an 8-point daily program you can edit from Home
# Assistant, and a point editor. Include it together with a board file and common/base.yaml
# (the top-level kessil-*.yaml files do this for you).
#
# This is a thin wrapper around the reusable template common/group-tuna-blue.yaml. To add another
# Tuna Blue group, include the template directly with its vars (see the template header and the
# README); this file keeps the group that existing installations already use.
#
# Substitutions you can override:
#   tuna_blue_gid   the K-Link group this controls (default 1). Changing it moves the group; the
#                   entity names and ids stay the same, so stored programs follow the group.
substitutions:
  tuna_blue_gid: "1"

packages:
  group: !include {file: group-tuna-blue.yaml, vars: {id: tuna_blue, name: Tuna Blue, gid: "${tuna_blue_gid}"}}
