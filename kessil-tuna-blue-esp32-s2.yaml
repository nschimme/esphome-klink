# DEPRECATED compatibility shim, kept so existing dashboard imports keep working.
# New installs: use kessil-leader-<board>.yaml, which includes all three lamp models.
# Kessil Tuna Blue on an ESP32-S2 (untested). Flash this, or adopt it from the ESPHome dashboard.
# See docs/getting-started.md for wiring, safety notes and the other ways to use this file.
substitutions:
  name: kessil-tuna-blue
  friendly_name: Kessil Tuna Blue

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: nschimme.esphome-klink
    version: "0.2.0"

dashboard_import:
  package_import_url: github://nschimme/esphome-klink/kessil-tuna-blue-esp32-s2.yaml@main
  import_full_config: false

packages:
  board: !include boards/esp32-s2.yaml
  network: !include common/network-wifi.yaml
  base: !include common/base.yaml
  lamp: !include common/tuna-blue.yaml
